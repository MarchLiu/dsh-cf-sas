name: Publish to npm

on:
  push:
    branches: [main]

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install local peer deps (dev check only)
        run: npm install --no-save @deepseek-ai/dsh-subagent@latest @deepseek-ai/dsh-tools@latest || true
      - name: Engine e2e dry run
        run: node test/dry-run.mjs

  publish:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # npm provenance
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: Skip if version already published
        id: check
        run: |
          VERSION=$(node -p "require('./package.json').version")
          NAME=$(node -p "require('./package.json').name")
          if npm view "$NAME@$VERSION" version >/dev/null 2>&1; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "$NAME@$VERSION already on npm — skipping"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
            echo "will publish $NAME@$VERSION"
          fi
      - name: Verify NPM_TOKEN validity (clear error on expiry)
        run: |
          if ! npm whoami >/dev/null 2>&1; then
            echo "::error::NPM_TOKEN is invalid or EXPIRED. Create a new Automation token on npmjs.com and run: gh secret set NPM_TOKEN -R MarchLiu/dsh-cf-sas"
            exit 1
          fi
          echo "token OK (publisher: $(npm whoami))"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Publish
        if: steps.check.outputs.publish == 'true'
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
